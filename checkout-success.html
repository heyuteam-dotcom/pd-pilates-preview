<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PD Pilates｜結帳後資料填寫預覽</title><link rel="stylesheet" href="shared/style.css"><script src="shared/config.js" defer></script><script src="shared/app.js" defer></script></head><body ><main class="page booking-page"><div class="brandline"><a href="landing.html">PD PILATES</a><small>MOVE WITH INTENTION</small></div><h1 class="headline">填寫體驗聯絡資料</h1><p class="status">此為結帳後頁面預覽，尚未付款；輸入資料僅供本頁操作，不會送出或儲存。</p><div class="booking-layout"><form class="booking-panel" id="contact-form"><h2>基本資料</h2><label for="name">姓名</label><input id="name" name="name" autocomplete="name" required><label for="phone">電話</label><input id="phone" name="phone" type="tel" autocomplete="tel" required><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><button class="button" type="submit">預覽下一步</button></form><section class="booking-panel"><h2>與分店確認時間</h2><p id="selected-branch"></p><p>加入所選分店官方 LINE，提供希望體驗的日期與時段，由客服確認可預約時間。</p><a class="button" id="selected-line" href="contact.html">查看分店聯絡方式</a><div class="booking-result" id="form-result" role="status"></div></section></div></main></body></html>
